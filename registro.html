<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SaborExpress - Crear Cuenta</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="css/login-mispedidos.css">
</head>
<body class="login-page d-flex align-items-center justify-content-center">

    <div class="card login-card p-4 p-md-5" style="max-width: 420px;">

        <h1 class="fs-4 fw-bold mb-1">Crear cuenta nueva</h1>
        <p class="text-muted small mb-4">Regístrate para ordenar tus pupusas favoritas calentitas directo a tu domicilio.</p>

        <form>
            <div class="mb-3">
                <label class="form-label-soft d-block">Nombre Completo</label>
                <input type="text" class="form-control form-control-soft" placeholder="Juan Pérez">
            </div>
            <div class="mb-3">
                <label class="form-label-soft d-block">Correo Electrónico</label>
                <input type="email" class="form-control form-control-soft" placeholder="juan.perez@correo.com">
            </div>
            <div class="mb-3">
                <label class="form-label-soft d-block">Teléfono (WhatsApp)</label>
                <input type="tel" class="form-control form-control-soft" placeholder="7777-7777">
            </div>
            <div class="mb-3">
                <label class="form-label-soft d-block">Contraseña</label>
                <input type="password" class="form-control form-control-soft" placeholder="Crear contraseña">
            </div>
            <div class="mb-4">
                <label class="form-label-soft d-block">Confirmar Contraseña</label>
                <input type="password" class="form-control form-control-soft" placeholder="Repetir contraseña">
            </div>
            <button type="submit" class="btn btn-dark w-100">Registrarse</button>
        </form>

        <p class="text-center mt-3 mb-0 small">
            ¿Ya tienes cuenta? <a href="login.html" class="login-link">Inicia sesión</a>
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
