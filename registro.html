<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SaborExpress - Crear Cuenta</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height:100vh;">
    <div class="card shadow rounded-3 p-4" style="max-width:420px; width:100%;">
        <h1 class="fs-4 fw-bold mb-1">Crear cuenta nueva</h1>
        <p class="text-muted small mb-3">Regístrate para ordenar tus pupusas y recibirlas a domicilio.</p>
        <form>
            <div class="mb-3"><label class="form-label">Nombre Completo</label><input type="text" class="form-control" placeholder="Juan Pérez"></div>
            <div class="mb-3"><label class="form-label">Correo Electrónico</label><input type="email" class="form-control" placeholder="juan.perez@correo.com"></div>
            <div class="mb-3"><label class="form-label">Teléfono (WhatsApp)</label><input type="tel" class="form-control" placeholder="7777-7777"></div>
            <div class="mb-3"><label class="form-label">Contraseña</label><input type="password" class="form-control" placeholder="Crear contraseña"></div>
            <div class="mb-3"><label class="form-label">Confirmar Contraseña</label><input type="password" class="form-control" placeholder="Repetir contraseña"></div>
            <button type="submit" class="btn btn-dark w-100">Registrarse</button>
        </form>
        <p class="text-center mt-3 mb-0">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
    </div>
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
