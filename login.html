<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SaborExpress - Iniciar Sesión</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/login-mispedidos.css">
</head>
<body class="login-page d-flex align-items-center justify-content-center">

    <div class="card login-card shadow-sm p-4 p-md-5">

        <div class="text-center mb-4">
            <div class="login-logo">
                <img src="img/logo.png" alt="SaborExpress">
            </div>
            <h1 class="fs-4 fw-bold mb-1">SaborExpress</h1>
            <p class="text-muted small mb-0">Las mejores pupusas de El Salvador</p>
        </div>

        <div id="loginError" class="form-error d-none" role="alert"></div>

        <form id="loginForm" novalidate>
            <div class="mb-3">
                <label class="form-label-soft d-block" for="loginCorreo">Correo Electrónico</label>
                <input id="loginCorreo" type="email" class="form-control form-control-soft" placeholder="ejemplo@correo.com" required>
            </div>
            <div class="mb-4">
                <label class="form-label-soft d-block" for="loginPassword">Contraseña</label>
                <input id="loginPassword" type="password" class="form-control form-control-soft" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-brand w-100">Iniciar sesión</button>
        </form>

        <p class="text-center mt-3 mb-0 small">
            ¿No tienes cuenta? <a href="registro.html" class="login-link">Crear cuenta</a>
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
