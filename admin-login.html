<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Inicio de sesión del portal administrativo de SaborExpress.">
    <title>SaborExpress Admin - Iniciar sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="img/logo.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="css/menu-reportes.css">
</head>
<body class="admin-login-page">
    <main class="admin-login-shell">
        <section class="admin-login-card" aria-labelledby="adminLoginTitle">
            <div class="admin-login-brand mb-4">
                <span class="brand-mark"><img src="img/logo.png" alt="SaborExpress" style="width:65%;height:65%;object-fit:contain;"></span>
                <div>
                    <strong>SaborExpress</strong>
                    <small>Portal administrativo</small>
                </div>
            </div>

            <h1 id="adminLoginTitle" class="admin-login-title">Iniciar sesión</h1>
            <p class="text-secondary mb-4">Acceso exclusivo para personal administrador.</p>

            <form id="adminLoginForm" novalidate>
                <div class="mb-3">
                    <label for="adminEmail" class="form-label">Correo electrónico</label>
                    <input id="adminEmail" class="form-control" type="email" autocomplete="username" placeholder="correo@ejemplo.com" required>
                    <div class="invalid-feedback">Ingresa un correo válido.</div>
                </div>

                <div class="mb-3">
                    <label for="adminPassword" class="form-label">Contraseña</label>
                    <div class="input-group">
                        <input id="adminPassword" class="form-control" type="password" autocomplete="current-password" minlength="6" required>
                        <button class="btn btn-outline-secondary" type="button" data-toggle-password aria-label="Mostrar u ocultar contraseña"><i class="bi bi-eye"></i></button>
                        <div class="invalid-feedback">Ingresa tu contraseña.</div>
                    </div>
                </div>

                <div id="adminLoginError" class="alert alert-danger py-2 d-none" role="alert">Correo o contraseña incorrectos.</div>

                <button class="btn btn-brand w-100 py-2" type="submit">Entrar al portal</button>
            </form>

            <a class="admin-back-store" href="menu.html"><i class="bi bi-arrow-left me-1"></i>Volver al sitio</a>
        </section>
    </main>

    <script type="module" src="js/admin-login.js"></script>
    <script src="js/carrito.js"></script>
</body>
</html>
